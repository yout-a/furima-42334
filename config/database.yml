default: &default
  adapter: mysql2
  encoding: utf8
  collation: utf8_general_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: root
  password: <%= ENV["DATABASE_PASSWORD"] %>
  host: localhost
  socket: /var/lib/mysql/mysql.sock
development:
  <<: *default
  database: furima_42334_development

test:
  <<: *default
  database: furima_42334_test

production:
  <<: *default
  database: furima_42334_production
